name: Build Android APK + Windows installer
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk JimmyTech-Dashboard.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: JimmyTech-Dashboard.apk }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: JimmyTech-Dashboard.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: dist/*.exe }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.exe }
